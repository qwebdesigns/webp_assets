<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLOCKADE — ассеты</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>BLOCKADE — ассеты</h1>
  <p class="note">Бандлы читаются в браузере, качаются через PHP-прокси на моём хостинге. На серверах ничего не хранится.</p>
</header>

<nav id="bundles" class="bundles" aria-label="Бандлы"></nav>

<section class="toolbar">
  <input id="search" type="search" placeholder="Поиск по имени…" autocomplete="off">
  <select id="type">
    <option value="">Все типы</option>
  </select>
  <span id="status" class="status">Выберите бандл</span>
</section>

<div id="progress" class="progress" hidden><div id="progress-bar"></div></div>

<main id="grid" class="grid"></main>

<div id="overlay" class="overlay" hidden>
  <div class="panel">
    <button id="close" class="close" type="button" aria-label="Закрыть">×</button>
    <div id="preview" class="preview"></div>
    <div class="details">
      <h2 id="asset-name"></h2>
      <dl id="asset-meta"></dl>
      <a id="download" class="download" download>Скачать</a>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
